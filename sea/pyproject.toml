[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sea-lib"
version = "0.1.0"
description = "Shared SEA pipeline modules (alignment, normalization, aggregation, data loading), packaged as a wheel for the AWS Glue Python shell job's --extra-py-files (Python shell only supports .egg/.whl there, not loose .py files or a plain zip)."
requires-python = ">=3.9"

[tool.setuptools]
py-modules = ["alignment", "normalization", "aggregation", "load_data"]
